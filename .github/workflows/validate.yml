name: Validate Power

on:
  pull_request:
    paths:
      - "skills/**"
      - "assets/**"
      - "POWER.md"
      - "README.md"
      - "plugin.json"
      - "scripts/validate_power.py"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "assets/**"
      - "POWER.md"
      - "README.md"
      - "plugin.json"
      - "scripts/validate_power.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validate_power.py
        run: python scripts/validate_power.py
